{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 450px;">
    <h1>🔑 Forgot Password</h1>
    <p class="auth-subtitle">Enter your registered email address below, and we'll send you an OTP to reset your password.</p>

    <form action="/forgot-password" method="POST">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                id="email"
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >
        </div>

        <button type="submit" class="auth-btn">
            Send OTP Verification
        </button>

        <p class="auth-link">
            <a href="/login" style="color: var(--text-muted); font-weight: 500;">Back to Login</a>
        </p>
    </form>
</div>
{% endblock %}
