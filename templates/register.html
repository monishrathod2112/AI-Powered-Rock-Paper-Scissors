{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 500px;">
    <h1>📝 Create Account</h1>
    <p class="auth-subtitle">Sign up to compete with the evolving AI model and save records.</p>

    <form action="/register" method="POST">
        <!-- Username -->
        <div class="form-group">
            <label for="username">Username</label>
            <input
                id="username"
                type="text"
                name="username"
                placeholder="Choose a username"
                required
            >
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                id="email"
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>
            <div style="position: relative; display: flex; align-items: center;">
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="At least 8 characters (1 uppercase, 1 special, 1 number)"
                    required
                >
                <button
                    type="button"
                    onclick="togglePassword('password', event)"
                    style="position: absolute; right: 8px; padding: 6px 12px; font-size: 13px; background: rgba(255,255,255,0.08); border: 1px solid var(--card-border); color: var(--text-main); border-radius: 6px; width: auto; min-width: auto; height: auto;"
                >
                    👁
                </button>
            </div>
            
            <!-- Password Strength -->
            <div style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
                <span id="strengthText" style="font-size: 12px; font-weight: 600; color: var(--text-muted);">Strength: -</span>
            </div>
            <progress
                id="strengthBar"
                value="0"
                max="100"
                style="width:100%; height:6px; border-radius: 3px; overflow: hidden; background: rgba(255,255,255,0.1); border: none;"
            ></progress>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div style="position: relative; display: flex; align-items: center;">
                <input
                    id="confirmPassword"
                    type="password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    required
                >
                <button
                    type="button"
                    onclick="togglePassword('confirmPassword', event)"
                    style="position: absolute; right: 8px; padding: 6px 12px; font-size: 13px; background: rgba(255,255,255,0.08); border: 1px solid var(--card-border); color: var(--text-main); border-radius: 6px; width: auto; min-width: auto; height: auto;"
                >
                    👁
                </button>
            </div>
            <span id="passwordMessage" style="font-size: 12px; display: block; margin-top: 6px; font-weight: 600;"></span>
        </div>

        <button type="submit" class="auth-btn" style="margin-top: 10px;">
            Register Account
        </button>
    </form>

    <p class="auth-link">
        Already have an account? <a href="/login">Login Here</a>
    </p>
</div>

<script>
function togglePassword(fieldId, e) {
    e.preventDefault();
    const field = document.getElementById(fieldId);
    if (field.type === "password") {
        field.type = "text";
    } else {
        field.type = "password";
    }
}

// Password Strength Meter
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");
const strengthText = document.getElementById("strengthText");
const strengthBar = document.getElementById("strengthBar");
const passwordMessage = document.getElementById("passwordMessage");

passwordInput.addEventListener("input", function () {
    let value = passwordInput.value;
    let score = 0;

    if (value.length >= 8) score += 25;
    if (/[A-Z]/.test(value)) score += 25;
    if (/[0-9]/.test(value)) score += 25;
    if (/[^A-Za-z0-9]/.test(value)) score += 25;

    strengthBar.value = score;

    if (value.length === 0) {
        strengthText.innerHTML = "Strength: -";
        strengthText.style.color = "var(--text-muted)";
    } else if (score <= 25) {
        strengthText.innerHTML = "🔴 Weak Password";
        strengthText.style.color = "#ef4444";
    } else if (score <= 50) {
        strengthText.innerHTML = "🟡 Medium Password";
        strengthText.style.color = "#fbbf24";
    } else if (score <= 75) {
        strengthText.innerHTML = "🟢 Strong Password";
        strengthText.style.color = "#34d399";
    } else {
        strengthText.innerHTML = "💪 Very Strong Password";
        strengthText.style.color = "#10b981";
    }
});

// Confirm Password Check
confirmInput.addEventListener("input", function () {
    if (confirmInput.value.length === 0) {
        passwordMessage.innerHTML = "";
    } else if (passwordInput.value === confirmInput.value) {
        passwordMessage.innerHTML = "✅ Passwords Match";
        passwordMessage.style.color = "#10b981";
    } else {
        passwordMessage.innerHTML = "❌ Passwords Do Not Match";
        passwordMessage.style.color = "#ef4444";
    }
});

// Prevent form submission if password verification fails
document.querySelector("form").addEventListener("submit", function (e) {
    if (passwordInput.value !== confirmInput.value) {
        alert("Passwords do not match!");
        e.preventDefault();
    }
});
</script>
{% endblock %}
