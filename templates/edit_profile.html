{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 500px;">
    <h1>⚙️ Edit Profile</h1>
    <p class="auth-subtitle">Update your personal metadata and custom profile picture.</p>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="username">Username</label>
            <input
                id="username"
                type="text"
                name="username"
                value="{{ current_user.username }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                id="email"
                type="email"
                name="email"
                value="{{ current_user.email }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="bio">Profile Bio</label>
            <textarea
                id="bio"
                name="bio"
                rows="4"
                placeholder="Tell us about yourself..."
                style="resize: vertical;"
            >{{ current_user.bio }}</textarea>
        </div>

        <div class="form-group">
            <label for="profile_image">Upload Profile Avatar (PNG, JPG, JPEG)</label>
            <input
                id="profile_image"
                type="file"
                name="profile_image"
                accept=".png,.jpg,.jpeg"
                style="padding: 8px 12px; background: rgba(0, 0, 0, 0.15);"
            >
        </div>

        <button type="submit" class="auth-btn">
            Save Settings
        </button>
        
        <p class="auth-link">
            <a href="/profile" style="color: var(--text-muted); font-weight: 500;">Cancel and Return</a>
        </p>
    </form>
</div>
{% endblock %}
